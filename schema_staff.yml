openapi: 3.0.3
info:
  title: INTELLIGENT HOTEL API
  version: 1.0.0
  description: API para la gestion inteligente de solicitudes, servicios, personal
    y eventos hoteleros.
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelTokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HotelTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HotelTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelTokenObtainPair'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/core/areas/:
    get:
      operationId: core_areas_list
      description: |-
        Limita automáticamente las consultas al hotel del usuario.

        Para modelos relacionados con el hotel mediante otra entidad,
        se puede configurar hotel_filter en cada vista.
      parameters:
      - in: query
        name: area_type
        schema:
          type: string
          enum:
          - BAR
          - CONCIERGE
          - EVENTS
          - HOUSEKEEPING
          - KITCHEN
          - MAINTENANCE
          - OTHER
          - RECEPTION
          - RESTAURANT
          - ROOM_SERVICE
          - SECURITY
        description: |-
          * `RECEPTION` - Recepción
          * `RESTAURANT` - Restaurante
          * `BAR` - Bar
          * `KITCHEN` - Cocina
          * `HOUSEKEEPING` - Habitaciones y housekeeping
          * `MAINTENANCE` - Mantenimiento
          * `EVENTS` - Eventos y banquetes
          * `ROOM_SERVICE` - Room service
          * `CONCIERGE` - Conserjería
          * `SECURITY` - Seguridad
          * `OTHER` - Otra área
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - core
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOperationalAreaList'
          description: ''
    post:
      operationId: core_areas_create
      description: |-
        Limita automáticamente las consultas al hotel del usuario.

        Para modelos relacionados con el hotel mediante otra entidad,
        se puede configurar hotel_filter en cada vista.
      tags:
      - core
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationalArea'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OperationalArea'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OperationalArea'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationalArea'
          description: ''
  /api/core/areas/{id}/:
    get:
      operationId: core_areas_retrieve
      description: |-
        Limita automáticamente las consultas al hotel del usuario.

        Para modelos relacionados con el hotel mediante otra entidad,
