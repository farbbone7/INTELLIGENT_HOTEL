components:
  schemas:
    AreaTypeEnum:
      enum:
      - RECEPTION
      - RESTAURANT
      - BAR
      - KITCHEN
      - HOUSEKEEPING
      - MAINTENANCE
      - EVENTS
      - ROOM_SERVICE
      - CONCIERGE
      - SECURITY
      - OTHER
      type: string
      description: |-
        * `RECEPTION` - Recepción
        * `RESTAURANT` - Restaurante
        * `BAR` - Bar
        * `KITCHEN` - Cocina
        * `HOUSEKEEPING` - Habitaciones y housekeeping
        * `MAINTENANCE` - Mantenimiento
        * `EVENTS` - Eventos y banquetes
        * `ROOM_SERVICE` - Room service
        * `CONCIERGE` - Conserjería
        * `SECURITY` - Seguridad
        * `OTHER` - Otra área
    CategoryEnum:
      enum:
      - '4'
      - '5'
      type: string
      description: |-
        * `4` - 4 estrellas
        * `5` - 5 estrellas
    CurrentUser:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
          title: Nombre de usuario
          description: 'Requerido. 150 carácteres como máximo. Únicamente letras,
            dígitos y @/./+/-/_ '
        email:
          type: string
          format: email
          readOnly: true
          title: Correo electrónico
        first_name:
          type: string
          readOnly: true
          title: Nombre
        last_name:
          type: string
          readOnly: true
          title: Apellidos
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
          title: Rol del usuario
        hotel_id:
          type: integer
          readOnly: true
          nullable: true
        hotel_name:
          type: string
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
          title: Activo
          description: Indica si el usuario debe ser tratado como activo. Desmarque
            esta opción en lugar de borrar la cuenta.
        is_staff:
          type: boolean
          readOnly: true
          title: Es staff
          description: Indica si el usuario puede entrar en este sitio de administración.
        is_superuser:
          type: boolean
          readOnly: true
          title: Es superusuario
          description: Indica que este usuario tiene todos los permisos sin asignárselos
            explícitamente.
      required:
      - email
      - first_name
      - hotel_id
      - hotel_name
      - id
      - is_active
      - is_staff
      - is_superuser
      - last_name
      - role
      - username
    Employee:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        hotel_id:
          type: integer
        hotel_name:
          type: string
          readOnly: true
        user_id:
          type: integer
          nullable: true
        employee_code:
          type: string
          maxLength: 30
        document_number:
          type: string
          maxLength: 30
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          oneOf:
          - type: string
            format: email
