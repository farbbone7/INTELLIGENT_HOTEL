
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}TaskFlow 2.0{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f1f5f9;
            color: #1e293b;
            min-height: 100vh;
        }

        header {
            background-color: #172554;
            color: white;
            padding: 22px 8%;
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        header p {
            color: #cbd5e1;
            font-size: 14px;
        }

        nav {
            background-color: #1e40af;
            padding: 14px 8%;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
            font-weight: bold;
        }

        nav a:hover {
            color: #bfdbfe;
        }

        main {
            max-width: 950px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        h2 {
            margin-bottom: 20px;
            color: #172554;
        }

        p {
            line-height: 1.6;
        }

        .boton {
            display: inline-block;
            background-color: #2563eb;
            color: white;
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 15px;
        }

        .boton:hover {
            background-color: #1d4ed8;
        }

        .error {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 18px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            main {
                margin: 20px 12px;
                padding: 20px;
            }

            header, nav {
                padding-left: 20px;
                padding-right: 20px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>TaskFlow 2.0</h1>
        <p>Sistema web de gestión de tareas</p>
    </header>

    <nav>
        <a href="{% url 'listar' %}">Ver tareas</a>
        <a href="{% url 'crear' %}">Nueva tarea</a>
    </nav>

    <main>
        {% block contenido %}
        {% endblock %}
    </main>

    <footer>
        TaskFlow Web 2.0 | Proyecto Integrador Backend
    </footer>

</body>
</html>
